<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="960" height="560" viewBox="0 0 960 560"
     style="background-color:#0e0e14;font-family:Inter,Arial,sans-serif">
  <title>Generic percussion generator UI redesign</title>
  <desc>Compact single-page percussion device assembled exclusively from the visual component language documented in daw_elements.svg.</desc>

  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262635"/>
      <stop offset="1" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="visualizerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="1" stop-color="#09090d"/>
    </linearGradient>

    <!-- Strip RotaryKnob body copied from 02 RotaryKnob in daw_elements.svg. -->
    <g id="stripKnob" inkscape:label="knob_strip_default">
      <circle cx="32.5" cy="30.5" r="20.322" fill="#14141c"/>
      <path d="M13.965 49.035C9.221 44.292 6.287 37.738 6.287 30.5C6.287 16.023 18.023 4.287 32.5 4.287C46.977 4.287 58.713 16.023 58.713 30.5C58.713 37.738 55.779 44.292 51.035 49.035"
            fill="none" stroke="#2c2c36" stroke-width="3.574" stroke-linecap="round"/>
      <path d="M13.965 49.035C9.221 44.292 6.287 37.738 6.287 30.5C6.287 16.023 18.023 4.287 32.5 4.287"
            fill="none" stroke="#e85d4b" stroke-width="3.574" stroke-linecap="round"/>
      <circle cx="32.5" cy="8.678" r="2.5" fill="#e85d4b"/>
    </g>

    <!-- Small side-panel knob from 09 Output Panels in daw_elements.svg. -->
    <g id="railKnob" inkscape:label="knob_strip_default_side_panel">
      <circle cx="32" cy="29" r="15.242" fill="#14141c"/>
      <path d="M18.1 42.9C14.55 39.35 12.35 34.43 12.35 29C12.35 18.14 21.15 9.34 32 9.34C42.86 9.34 51.66 18.14 51.66 29C51.66 34.43 49.46 39.35 45.9 42.9"
            fill="none" stroke="#2c2c36" stroke-width="2.68" stroke-linecap="round"/>
      <path d="M18.1 42.9C14.55 39.35 12.35 34.43 12.35 29C12.35 18.14 21.15 9.34 32 9.34"
            fill="none" stroke="#9a9aa8" stroke-width="2.68" stroke-linecap="round"/>
      <circle cx="32" cy="12.63" r="1.875" fill="#9a9aa8"/>
    </g>

    <!-- Flat selector/icon-toggle primitives from 10 Device Header Bar. -->
    <g id="keytrackIcon" inkscape:label="icon_toggle">
      <rect width="22" height="20" rx="3" fill="#12121a" stroke="#e85d4b" stroke-width="1"/>
      <rect x="4" y="5" width="3" height="10" fill="#e85d4b"/>
      <rect x="9" y="5" width="3" height="10" fill="#e85d4b"/>
      <rect x="14" y="5" width="3" height="10" fill="#e85d4b"/>
      <rect x="6" y="5" width="2" height="6" fill="#0e0e14"/>
      <rect x="11" y="5" width="2" height="6" fill="#0e0e14"/>
    </g>
  </defs>

  <rect width="960" height="560" fill="#0e0e14"/>
  <text x="70" y="54" fill="#ffffff" font-size="22" font-weight="700">Generic Percussion Generator</text>
  <text x="70" y="77" fill="#9a9aa8" font-size="12">Compact single-page hierarchy · assembled from daw_elements.svg primitives</text>

  <!-- Device assembly: 30 tool rail + 4 accent + 360 card + 4 accent + 64 output. -->
  <g transform="translate(70 112)" inkscape:label="generic_percussion_device">
    <!-- Tool rail -->
    <path d="M30 0H10C4.477 0 0 4.477 0 10V310C0 315.523 4.477 320 10 320H30"
          fill="#16161e" stroke="#4a4a5c" stroke-width="1.5"/>
    <path d="M15 11V17" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M10.8 14A5.6 5.6 0 1 0 19.2 14" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M8 35H12L14 37H22V45H8Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
    <text transform="translate(17 181) rotate(-90)" text-anchor="middle" fill="#e85d4b" font-size="9" font-weight="700" letter-spacing="1.2">PERCUSSION</text>
    <path d="M9 298H21M12 298V296H18V298M11 301V311C11 312 12 313 13 313H17C18 313 19 312 19 311V301"
          fill="none" stroke="#e86666" stroke-width="1"/>

    <!-- Main card and accent stripes -->
    <rect x="30" y="0" width="364" height="320" fill="#1a1a24" stroke="#4a4a5c" stroke-width="1.5"/>
    <rect x="30" y="0" width="4" height="320" fill="#e85d4b"/>
    <rect x="390" y="0" width="4" height="320" fill="#e85d4b"/>
    <rect x="34" y="0" width="356" height="40" fill="url(#headerGrad)"/>

    <!-- Flat algorithm tabs from the existing device header tab bar. Algorithm
         selection is structural state, not a modulation/automation target. -->
    <rect x="34" y="0" width="99" height="40" fill="#e85d4b" fill-opacity="0.16"/>
    <rect x="34" y="37" width="99" height="3" fill="#e85d4b"/>
    <text x="83.5" y="24" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">808</text>
    <line x1="133" y1="8" x2="133" y2="32" stroke="#4a4a5c"/>
    <text x="182.5" y="24" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">909</text>
    <line x1="232" y1="8" x2="232" y2="32" stroke="#4a4a5c"/>
    <text x="281.5" y="24" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">ANALOG</text>
    <rect x="352" y="9" width="26" height="22" rx="3" fill="#12121a" stroke="#4a4a5c"/>
    <path d="M362 15L370 20L362 25Z" fill="#e85d4b"/>

    <!-- Three unnamed recessed cards. Hierarchy comes from spatial grouping and
         a slightly darker themed surface, not headings or divider labels. -->
    <g inkscape:label="tune_sweep_panel">
      <rect x="42" y="48" width="104" height="260" rx="4" fill="#14141c" stroke="#343440"/>
      <!-- Preview is intentionally local and small, not a full-width hero. -->
      <rect x="50" y="59" width="88" height="34" rx="3" fill="url(#visualizerGrad)" stroke="#2c2c36"/>
      <path d="M56 85C64 62 73 63 82 77C93 89 106 84 132 85" fill="none" stroke="#e85d4b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M56 87C76 72 94 75 108 82C117 86 124 87 132 87" fill="none" stroke="#9a9aa8" stroke-opacity=".55"/>
      <g transform="translate(70 111) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="9" font-weight="700" text-anchor="middle">C1</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Pitch</text></g>
      <g transform="translate(116 121) scale(.72)"><use href="#keytrackIcon"/></g>
      <g transform="translate(48 218) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">+24</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Drop</text></g>
      <g transform="translate(98 218) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">28ms</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Sweep</text></g>
    </g>

    <g inkscape:label="body_attack_panel">
      <rect x="151" y="48" width="112" height="260" rx="4" fill="#14141c" stroke="#343440"/>
      <g transform="translate(155 67) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">72%</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Body</text></g>
      <g transform="translate(211 67) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">48%</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Tone</text></g>
      <g transform="translate(155 190) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">36%</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Click</text></g>
      <g transform="translate(211 190) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="8" font-weight="700" text-anchor="middle">62%</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Color</text></g>
    </g>

    <g inkscape:label="shape_panel">
      <rect x="268" y="48" width="110" height="260" rx="4" fill="#14141c" stroke="#343440"/>
      <g transform="translate(300 74) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="9" font-weight="700" text-anchor="middle">94 ms</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Length</text></g>
      <g transform="translate(300 202) scale(.72)"><use href="#stripKnob"/><text x="32.5" y="34" fill="#e85d4b" font-size="9" font-weight="700" text-anchor="middle">18%</text><text x="32.5" y="69" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">Drive</text></g>
    </g>

    <!-- Mono output rail -->
    <path d="M394 0H448A10 10 0 0 1 458 10V310A10 10 0 0 1 448 320H394Z"
          fill="#16161e" stroke="#4a4a5c" stroke-width="1.5"/>
    <text x="426" y="17" fill="#9a9aa8" font-size="9" font-weight="700" text-anchor="middle">OUT</text>
    <rect x="418" y="28" width="16" height="104" fill="#0a0a0f"/>
    <rect x="418" y="72" width="16" height="60" fill="#4ade80" fill-opacity="0.85"/>
    <g transform="translate(394 145)"><use href="#railKnob"/><text x="32" y="32" fill="#9a9aa8" font-size="7.5" font-weight="700" text-anchor="middle">68%</text><text x="32" y="59" fill="#9a9aa8" font-size="8" font-weight="700" text-anchor="middle">Velocity</text></g>
    <g transform="translate(394 229)"><use href="#railKnob"/><text x="32" y="32" fill="#9a9aa8" font-size="7.5" font-weight="700" text-anchor="middle">0 dB</text><text x="32" y="59" fill="#9a9aa8" font-size="8" font-weight="700" text-anchor="middle">Gain</text></g>
  </g>

  <!-- Design notes use existing DAW chapter typography and flat label cells. -->
  <g transform="translate(590 128)">
    <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="700">STRUCTURAL CHOICES</text>
    <g transform="translate(0 20)">
      <rect width="292" height="42" rx="4" fill="#1a1a24" stroke="#4a4a5c"/>
      <rect width="4" height="42" fill="#e85d4b"/>
      <text x="18" y="18" fill="#e85d4b" font-size="9" font-weight="700">1 · ALGORITHM TABS</text>
      <text x="18" y="32" fill="#9a9aa8" font-size="9">Flat header buttons; no parameter overlays</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="292" height="42" rx="4" fill="#1a1a24" stroke="#4a4a5c"/>
      <rect width="4" height="42" fill="#e85d4b"/>
      <text x="18" y="18" fill="#ffffff" font-size="9" font-weight="700">2 · UNNAMED CARDS</text>
      <text x="18" y="32" fill="#9a9aa8" font-size="9">Subtle surfaces establish hierarchy</text>
    </g>
    <g transform="translate(0 120)">
      <rect width="292" height="42" rx="4" fill="#1a1a24" stroke="#4a4a5c"/>
      <rect width="4" height="42" fill="#e85d4b"/>
      <text x="18" y="18" fill="#ffffff" font-size="9" font-weight="700">3 · LOCAL PREVIEW</text>
      <text x="18" y="32" fill="#9a9aa8" font-size="9">Small and attached to temporal controls</text>
    </g>
    <g transform="translate(0 183)">
      <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="700">RULES SHOWN</text>
      <text x="0" y="24" fill="#9a9aa8" font-size="10">• algorithms are structural, not automatable</text>
      <text x="0" y="44" fill="#9a9aa8" font-size="10">• tab only appears when its algorithm exists</text>
      <text x="0" y="64" fill="#9a9aa8" font-size="10">• every primary knob uses one fixed size</text>
      <text x="0" y="84" fill="#9a9aa8" font-size="10">• preview lives inside its relevant panel</text>
      <text x="0" y="104" fill="#9a9aa8" font-size="10">• existing mono output panel retained</text>
    </g>
  </g>

  <text x="70" y="507" fill="#9a9aa8" font-size="10">Pitch mode shows an absolute key; with keytrack enabled the same control becomes Tune and displays a relative semitone offset.</text>
  <text x="70" y="530" fill="#5f5f6d" font-size="9">Concept only · component styling and dimensions sourced from docs/architecture/daw_elements.svg</text>
</svg>
