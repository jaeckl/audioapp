    <g id="shell"><use href="#toolRail"/><rect x="30" width="4" height="320" fill="#7b6cf6"/><rect x="34" width="500" height="320" fill="#1a1a24" stroke="#4a4a5c" stroke-width="1.5"/><rect x="534" width="4" height="320" fill="#7b6cf6"/><use href="#outputRail" x="538"/></g>
  </defs>
  <rect width="1920" height="580" fill="#0e0e14"/>
  <text x="54" y="42" class="pageTitle">SUBTRACTIVE SYNTH · DESIGN-SYSTEM CORRECTION</text>
  <text x="54" y="64" class="caption">One panel proposal, shown in its real Osc / Filter / Amp states. Device name stays in the tool rail; the 40 px header is only the existing DeviceTabBar.</text>

  <!-- OSC state -->
  <g transform="translate(54 118)">
    <text y="-14" class="caption">OSC PAGE · OSC 1 SELECTED</text><use href="#shell"/><g transform="translate(34)"><use href="#oscTabs"/>
      <g transform="translate(6 46)">
        <rect width="494" height="24" rx="5" class="inactive"/><rect width="247" height="24" rx="5" class="active"/><path d="M247 2v20" stroke="#fff" stroke-opacity=".10"/><text x="123.5" y="16" text-anchor="middle" class="tab" fill="#fff">OSC 1</text><text x="370.5" y="16" text-anchor="middle" class="tab mutedText">OSC 2</text>
        <rect y="30" width="330" height="106" rx="6" class="screen"/><path d="M14 85C45 38 75 113 108 76s62-39 94 0 62 38 114-8" fill="none" stroke="#7b6cf6" stroke-width="2"/><path d="M12 55h306M12 108h306M82 40v82m82-82v82m82-82v82" stroke="#fff" stroke-opacity=".05"/>
        <rect x="336" y="30" width="158" height="106" rx="6" class="panel"/><text x="415" y="46" text-anchor="middle" class="section">VOICE</text>
        <g transform="translate(375 76)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">4</text><text y="31" text-anchor="middle" class="knobLabel">Voices</text></g><g transform="translate(454 76)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">18%</text><text y="31" text-anchor="middle" class="knobLabel">Spread</text></g>
        <rect y="142" width="494" height="120" rx="6" class="panel"/><text x="10" y="158" class="section">OSCILLATOR 1 PARAMETERS</text>
        <g transform="translate(45 191)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">Saw</text><text y="31" text-anchor="middle" class="knobLabel">Shape</text></g><g transform="translate(112 191)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">0</text><text y="31" text-anchor="middle" class="knobLabel">Octave</text></g><g transform="translate(179 191)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">0</text><text y="31" text-anchor="middle" class="knobLabel">Semi</text></g><g transform="translate(246 191)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">+4¢</text><text y="31" text-anchor="middle" class="knobLabel">Fine</text></g><g transform="translate(313 191)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">0%</text><text y="31" text-anchor="middle" class="knobLabel">Sync</text></g>
        <path d="M340 151v102" stroke="#7b6cf6" stroke-opacity=".35"/><rect x="350" y="148" width="134" height="22" rx="3" class="inactive"/><text x="360" y="163" class="section">SOURCE MIX</text><text x="474" y="163" text-anchor="end" class="tab accentText">Mix ▾</text>
        <g transform="translate(382 194)"><use href="#smallKnob"/><text y="3" text-anchor="middle" class="value">50%</text><text y="28" text-anchor="middle" class="knobLabel">Mix</text></g><g transform="translate(452 194)"><use href="#smallKnob"/><text y="3" text-anchor="middle" class="value">0%</text><text y="28" text-anchor="middle" class="knobLabel">Noise</text></g><g transform="translate(382 236)"><use href="#smallKnob"/><text y="3" text-anchor="middle" class="value">0</text><text y="28" text-anchor="middle" class="knobLabel">Pitch</text></g><g transform="translate(452 236)"><use href="#smallKnob"/><text y="3" text-anchor="middle" class="value">0%</text><text y="28" text-anchor="middle" class="knobLabel">Feedback</text></g>
      </g>
    </g>
  </g>

  <!-- FILTER state -->
  <g transform="translate(660 118)">
    <text y="-14" class="caption">FILTER PAGE</text><use href="#shell"/><g transform="translate(34)"><use href="#filterTabs"/>
      <g transform="translate(6 46)"><rect width="494" height="92" rx="6" class="screen"/><text x="10" y="15" class="section">FILTER RESPONSE</text><path d="M14 74h52c35 0 56-4 80-13 31-12 63-31 96-34 44-4 67 45 103 47h135" fill="none" stroke="#7b6cf6" stroke-width="2"/><path d="M12 24h470M12 48h470M12 72h470M120 10v70m120-70v70m120-70v70" stroke="#fff" stroke-opacity=".05"/>
        <rect y="100" width="494" height="30" rx="6" class="panel"/><rect x="4" y="4" width="486" height="22" rx="5" class="inactive"/><rect x="4" y="4" width="81" height="22" rx="5" class="active"/><path d="M85 6v18m81-18v18m81-18v18m81-18v18m81-18v18" stroke="#fff" stroke-opacity=".10"/><text x="44" y="19" text-anchor="middle" class="tab" fill="#fff">LP 12</text><text x="125" y="19" text-anchor="middle" class="tab mutedText">HP 12</text><text x="206" y="19" text-anchor="middle" class="tab mutedText">BAND</text><text x="287" y="19" text-anchor="middle" class="tab mutedText">NOTCH</text><text x="368" y="19" text-anchor="middle" class="tab mutedText">FB</text><text x="449" y="19" text-anchor="middle" class="tab mutedText">LP 24</text>
        <rect y="138" width="330" height="124" rx="6" class="panel"/><text x="10" y="154" class="section">FILTER</text><g transform="translate(45 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">100%</text><text y="31" text-anchor="middle" class="knobLabel">Key</text></g><g transform="translate(106 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">2.4 kHz</text><text y="31" text-anchor="middle" class="knobLabel">Cutoff</text></g><g transform="translate(173 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">24%</text><text y="31" text-anchor="middle" class="knobLabel">Res</text></g><g transform="translate(234 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">36%</text><text y="31" text-anchor="middle" class="knobLabel">Env</text></g><g transform="translate(295 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">0%</text><text y="31" text-anchor="middle" class="knobLabel">FM</text></g>
        <rect x="336" y="138" width="158" height="124" rx="6" class="panel"/><text x="415" y="154" text-anchor="middle" class="section">COLOR</text><g transform="translate(376 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">12%</text><text y="31" text-anchor="middle" class="knobLabel">Drive</text></g><g transform="translate(454 190)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">Soft</text><text y="31" text-anchor="middle" class="knobLabel">Shaper</text></g>
      </g>
    </g>
  </g>

  <!-- AMP state -->
  <g transform="translate(1266 118)">
    <text y="-14" class="caption">AMP PAGE</text><use href="#shell"/><g transform="translate(34)"><use href="#ampTabs"/>
      <g transform="translate(6 46)"><rect width="314" height="262" rx="6" class="panel"/><rect x="8" y="8" width="298" height="126" rx="6" class="screen"/><path d="M18 119h15l42-90 65 55h86l68 35" fill="none" stroke="#7b6cf6" stroke-width="2"/><path d="M18 38h276M18 78h276M84 18v105m68-105v105m68-105v105" stroke="#fff" stroke-opacity=".05"/>
        <text x="14" y="150" class="section">AMP ENVELOPE</text><g transform="translate(48 184)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">5 ms</text><text y="31" text-anchor="middle" class="knobLabel">Attack</text></g><g transform="translate(120 184)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">280 ms</text><text y="31" text-anchor="middle" class="knobLabel">Decay</text></g><g transform="translate(192 184)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">72%</text><text y="31" text-anchor="middle" class="knobLabel">Sustain</text></g><g transform="translate(264 184)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">420 ms</text><text y="31" text-anchor="middle" class="knobLabel">Release</text></g>
        <rect x="322" width="172" height="154" rx="6" class="panel"/><text x="408" y="18" text-anchor="middle" class="section">PERFORMANCE</text><rect x="332" y="30" width="152" height="26" rx="5" class="inactive"/><rect x="332" y="30" width="76" height="26" rx="5" class="active"/><path d="M408 32v22" stroke="#fff" stroke-opacity=".10"/><text x="370" y="47" text-anchor="middle" class="tab" fill="#fff">POLY</text><text x="446" y="47" text-anchor="middle" class="tab mutedText">LEGATO</text><g transform="translate(367 94)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">Off</text><text y="31" text-anchor="middle" class="knobLabel">Glide</text></g><g transform="translate(447 94)"><use href="#knob"/><text y="3" text-anchor="middle" class="value">80%</text><text y="31" text-anchor="middle" class="knobLabel">Velocity</text></g>
      </g>
    </g>
  </g>
  <text x="54" y="525" class="caption">Interaction contract: Osc / Filter / Amp are the only primary tabs. OSC 1 / OSC 2 is a local segmented selector visible only on the Osc page; selection swaps the waveform and parameter bank below it.</text>
  <text x="54" y="548" class="caption">No title inside the tab bar. Orange is reserved for device identity, selected state, parameter value, and signal emphasis. Note FX and audio FX retain their own rail colors.</text>
</svg>
