      <path d="M15 10v6m-4-3a6 6 0 1 0 8 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 36h6l2 2h7v9H8z" fill="none" stroke="#fff" stroke-width="1"/>
      <text class="railName" text-anchor="middle" transform="translate(17 182) rotate(-90)">SUBTRACTOR</text>
      <path d="M9 298h12m-10 3v11h8v-11m-6-3v-3h4v3" fill="none" stroke="#e86666" stroke-width="1"/>
    </g>
    <g id="outputRail">
