    <g id="filterTabs"><use href="#tabBarBase"/><path d="M175 0h151c5 0 8 4 8 10v30H167V10c0-6 3-10 8-10z" fill="#15151d"/><rect x="35" y="11" width="18" height="17" fill="#9a9a9f"/><text x="94" y="25" text-anchor="middle" class="tab mutedText">OSC</text><rect x="201" y="11" width="18" height="17" fill="#7b6cf6"/><text x="260" y="25" text-anchor="middle" class="tab" fill="#fff">FILTER</text><rect x="368" y="11" width="18" height="17" fill="#9a9a9f"/><text x="427" y="25" text-anchor="middle" class="tab mutedText">AMP</text></g>
