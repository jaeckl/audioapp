<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="580" viewBox="0 0 1920 580">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif}.pageTitle{font-size:18px;font-weight:700;fill:#fff}.caption{font-size:11px;fill:#9a9aa8}.railName{font-size:9px;font-weight:700;letter-spacing:1.2px;fill:#e8a54b}.tab{font-size:10px;font-weight:700;letter-spacing:.4px}.section{font-size:8px;font-weight:700;letter-spacing:.8px;fill:#ffffff;fill-opacity:.30}.value{font-size:9px;font-weight:700;fill:#ececf0}.knobLabel{font-size:8px;font-weight:700;fill:#9a9aa8}.knob{fill:#101017;stroke:#3f3f4b;stroke-width:3}.range{fill:none;stroke:#343440;stroke-width:3;stroke-linecap:round}.arc{fill:none;stroke:#e8a54b;stroke-width:3;stroke-linecap:round}.pointer{stroke:#f4f4f7;stroke-width:2;stroke-linecap:round}.panel{fill:#121218;stroke:#fff;stroke-opacity:.08}.screen{fill:#0e0e14;stroke:#fff;stroke-opacity:.08}.inactive{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.10}.active{fill:#e8a54b;fill-opacity:.18;stroke:#e8a54b;stroke-opacity:.65}.accentText{fill:#e8a54b}.mutedText{fill:#fff;fill-opacity:.38}
    </style>
    <g id="knob"><circle r="15" class="knob"/><path d="M-12 9A15 15 0 1 1 12 9" class="range"/><path d="M-12 9A15 15 0 0 1 8-13" class="arc"/><path d="M0 0L7-10" class="pointer"/></g>
    <g id="smallKnob"><circle r="12" class="knob"/><path d="M-10 7A12 12 0 1 1 10 7" class="range"/><path d="M-10 7A12 12 0 0 1 6-10" class="arc"/><path d="M0 0L5-8" class="pointer"/></g>
    <g id="toolRail">
      <path d="M30 0H10A10 10 0 0 0 0 10v300a10 10 0 0 0 10 10h20" fill="#16161e" stroke="#4a4a5c" stroke-width="1.5"/>
      <path d="M15 10v6m-4-3a6 6 0 1 0 8 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 36h6l2 2h7v9H8z" fill="none" stroke="#fff" stroke-width="1"/>
      <text class="railName" text-anchor="middle" transform="translate(17 182) rotate(-90)">SUBTRACTOR</text>
      <path d="M9 298h12m-10 3v11h8v-11m-6-3v-3h4v3" fill="none" stroke="#e86666" stroke-width="1"/>
    </g>
    <g id="outputRail">
      <path d="M0 0h54a10 10 0 0 1 10 10v300a10 10 0 0 1-10 10H0z" fill="#16161e" stroke="#4a4a5c" stroke-width="1.5"/>
      <text x="38" y="16" text-anchor="middle" class="knobLabel">OUT</text>
      <path d="M31 31v-5h20v5m-20 0h-5v26h5m20-26h5v26h-5" fill="none" stroke="#f9ff00" stroke-width="1.4"/><path d="m35 50 5 4 5-4" fill="none" stroke="#f9ff00" stroke-width="1.4"/><text x="41" y="44" text-anchor="middle" font-size="7" font-weight="700" fill="#f9ff00">NOTE</text>
      <path d="M31 70v-5h20v5m-20 0h-5v26h5m20-26h5v26h-5" fill="none" stroke="#00ff33" stroke-width="1.4"/><path d="m35 89 5 4 5-4" fill="none" stroke="#00ff33" stroke-width="1.4"/><text x="41" y="83" text-anchor="middle" font-size="7" font-weight="700" fill="#00ff33">FX</text>
      <g transform="translate(40 168)"><use href="#smallKnob"/><text y="29" text-anchor="middle" class="knobLabel">Pan</text><text y="40" text-anchor="middle" class="value">C</text></g>
      <g transform="translate(40 247)"><use href="#smallKnob"/><text y="29" text-anchor="middle" class="knobLabel">Gain</text><text y="40" text-anchor="middle" class="value">0 dB</text></g>
    </g>
    <g id="tabs">
      <rect x="6" y="4" width="158" height="32" rx="6" class="active"/><text x="85" y="24" text-anchor="middle" class="tab accentText">≋  OSC</text>
      <rect x="170" y="4" width="158" height="32" rx="6" class="inactive"/><text x="249" y="24" text-anchor="middle" class="tab mutedText">▽  FILTER</text>
      <rect x="334" y="4" width="160" height="32" rx="6" class="inactive"/><text x="414" y="24" text-anchor="middle" class="tab mutedText">≋  AMP</text>
    </g>
    <g id="shell"><use href="#toolRail"/><rect x="30" width="4" height="320" fill="#e8a54b"/><rect x="34" width="500" height="320" fill="#1a1a24" stroke="#4a4a5c" stroke-width="1.5"/><rect x="534" width="4" height="320" fill="#e8a54b"/><use href="#outputRail" x="538"/></g>
  </defs>
  <rect width="1920" height="580" fill="#0e0e14"/>
  <text x="54" y="42" class="pageTitle">SUBTRACTIVE SYNTH · DESIGN-SYSTEM CORRECTION</text>
  <text x="54" y="64" class="caption">One panel proposal, shown in its real Osc / Filter / Amp states. Device name stays in the tool rail; the 40 px header is only the existing DeviceTabBar.</text>

  <!-- OSC state -->
  <g transform="translate(54 118)">
    <text y="-14" class="caption">OSC PAGE · OSC 1 SELECTED</text><use href="#shell"/><g transform="translate(34)"><use href="#tabs"/>
      <g transform="translate(6 46)">
        <rect width="242" height="24" rx="4" class="active"/><text x="121" y="16" text-anchor="middle" class="tab accentText">OSC 1</text>
        <rect x="248" width="246" height="24" rx="4" class="inactive"/><text x="371" y="16" text-anchor="middle" class="tab mutedText">OSC 2</text>
        <rect y="30" width="330" height="106" rx="6" class="screen"/><path d="M14 85C45 38 75 113 108 76s62-39 94 0 62 38 114-8" fill="none" stroke="#e8a54b" stroke-width="2"/><path d="M12 55h306M12 108h306M82 40v82m82-82v82m82-82v82" stroke="#fff" stroke-opacity=".05"/>
        <rect x="336" y="30" width="158" height="106" rx="6" class="panel"/><text x="415" y="46" text-anchor="middle" class="section">VOICE</text>
        <g transform="translate(375 76)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Voices</text><text y="43" text-anchor="middle" class="value">4</text></g><g transform="translate(454 76)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Spread</text><text y="43" text-anchor="middle" class="value">18%</text></g>
        <rect y="142" width="494" height="120" rx="6" class="panel"/><text x="10" y="158" class="section">OSCILLATOR 1 PARAMETERS</text>
        <g transform="translate(45 191)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Shape</text><text y="43" text-anchor="middle" class="value">Saw</text></g><g transform="translate(112 191)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Octave</text><text y="43" text-anchor="middle" class="value">0</text></g><g transform="translate(179 191)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Semi</text><text y="43" text-anchor="middle" class="value">0</text></g><g transform="translate(246 191)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Fine</text><text y="43" text-anchor="middle" class="value">+4¢</text></g><g transform="translate(313 191)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Sync</text><text y="43" text-anchor="middle" class="value">0%</text></g>
        <path d="M340 151v102" stroke="#e8a54b" stroke-opacity=".35"/><text x="350" y="158" class="section">SOURCE MIX</text><rect x="350" y="166" width="54" height="20" rx="3" class="inactive"/><text x="377" y="180" text-anchor="middle" class="tab accentText">Mix ▾</text>
        <g transform="translate(421 191)"><use href="#smallKnob"/><text y="28" text-anchor="middle" class="knobLabel">Mix</text></g><g transform="translate(466 191)"><use href="#smallKnob"/><text y="28" text-anchor="middle" class="knobLabel">Noise</text></g><g transform="translate(377 231)"><use href="#smallKnob"/><text y="28" text-anchor="middle" class="knobLabel">Pitch</text></g><g transform="translate(444 231)"><use href="#smallKnob"/><text y="28" text-anchor="middle" class="knobLabel">Feedback</text></g>
      </g>
    </g>
  </g>

  <!-- FILTER state -->
  <g transform="translate(660 118)">
    <text y="-14" class="caption">FILTER PAGE</text><use href="#shell"/><g transform="translate(34)">
      <rect x="6" y="4" width="158" height="32" rx="6" class="inactive"/><text x="85" y="24" text-anchor="middle" class="tab mutedText">≋  OSC</text><rect x="170" y="4" width="158" height="32" rx="6" class="active"/><text x="249" y="24" text-anchor="middle" class="tab accentText">▽  FILTER</text><rect x="334" y="4" width="160" height="32" rx="6" class="inactive"/><text x="414" y="24" text-anchor="middle" class="tab mutedText">≋  AMP</text>
      <g transform="translate(6 46)"><rect width="494" height="92" rx="6" class="screen"/><path d="M14 74h52c35 0 56-4 80-13 31-12 63-31 96-34 44-4 67 45 103 47h135" fill="none" stroke="#e8a54b" stroke-width="2"/><path d="M12 24h470M12 48h470M12 72h470M120 10v70m120-70v70m120-70v70" stroke="#fff" stroke-opacity=".05"/>
        <rect y="100" width="494" height="30" rx="6" class="panel"/><rect x="4" y="4" width="76" height="22" rx="4" class="active"/><text x="42" y="19" text-anchor="middle" class="tab accentText">LP 12</text><text x="119" y="19" text-anchor="middle" class="tab mutedText">HP 12</text><text x="200" y="19" text-anchor="middle" class="tab mutedText">BAND</text><text x="284" y="19" text-anchor="middle" class="tab mutedText">NOTCH</text><text x="365" y="19" text-anchor="middle" class="tab mutedText">FB</text><text x="447" y="19" text-anchor="middle" class="tab mutedText">LP 24</text>
        <rect y="138" width="330" height="124" rx="6" class="panel"/><text x="10" y="154" class="section">FILTER</text><g transform="translate(45 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Key</text></g><g transform="translate(106 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Cutoff</text><text y="43" text-anchor="middle" class="value">2.4 kHz</text></g><g transform="translate(173 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Res</text></g><g transform="translate(234 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Env</text></g><g transform="translate(295 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">FM</text></g>
        <rect x="336" y="138" width="158" height="124" rx="6" class="panel"/><text x="415" y="154" text-anchor="middle" class="section">COLOR</text><g transform="translate(376 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Drive</text></g><g transform="translate(454 190)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Shaper</text></g>
      </g>
    </g>
  </g>

  <!-- AMP state -->
  <g transform="translate(1266 118)">
    <text y="-14" class="caption">AMP PAGE</text><use href="#shell"/><g transform="translate(34)">
      <rect x="6" y="4" width="158" height="32" rx="6" class="inactive"/><text x="85" y="24" text-anchor="middle" class="tab mutedText">≋  OSC</text><rect x="170" y="4" width="158" height="32" rx="6" class="inactive"/><text x="249" y="24" text-anchor="middle" class="tab mutedText">▽  FILTER</text><rect x="334" y="4" width="160" height="32" rx="6" class="active"/><text x="414" y="24" text-anchor="middle" class="tab accentText">≋  AMP</text>
      <g transform="translate(6 46)"><rect width="314" height="262" rx="6" class="panel"/><rect x="8" y="8" width="298" height="126" rx="6" class="screen"/><path d="M18 119h15l42-90 65 55h86l68 35" fill="none" stroke="#e8a54b" stroke-width="2"/><path d="M18 38h276M18 78h276M84 18v105m68-105v105m68-105v105" stroke="#fff" stroke-opacity=".05"/>
        <text x="14" y="150" class="section">AMP ENVELOPE</text><g transform="translate(48 184)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Attack</text></g><g transform="translate(120 184)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Decay</text></g><g transform="translate(192 184)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Sustain</text></g><g transform="translate(264 184)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Release</text></g>
        <rect x="322" width="172" height="154" rx="6" class="panel"/><text x="408" y="18" text-anchor="middle" class="section">PERFORMANCE</text><rect x="332" y="30" width="72" height="26" rx="4" class="active"/><text x="368" y="47" text-anchor="middle" class="tab accentText">POLY</text><rect x="412" y="30" width="72" height="26" rx="4" class="inactive"/><text x="448" y="47" text-anchor="middle" class="tab mutedText">LEGATO</text><g transform="translate(367 94)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Glide</text></g><g transform="translate(447 94)"><use href="#knob"/><text y="31" text-anchor="middle" class="knobLabel">Velocity</text></g>
      </g>
    </g>
  </g>
  <text x="54" y="525" class="caption">Interaction contract: Osc / Filter / Amp are the only primary tabs. OSC 1 / OSC 2 is a local segmented selector visible only on the Osc page; selection swaps the waveform and parameter bank below it.</text>
  <text x="54" y="548" class="caption">No title inside the tab bar. Orange is reserved for device identity, selected state, parameter value, and signal emphasis. Note FX and audio FX retain their own rail colors.</text>
</svg>
