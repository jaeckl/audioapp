<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="580" viewBox="0 0 1920 580">
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif}.pageTitle{font-size:18px;font-weight:700;fill:#fff}.caption{font-size:11px;fill:#9a9aa8}.railName{font-size:9px;font-weight:700;letter-spacing:1.2px;fill:#7b6cf6}.tab{font-size:10px;font-weight:700;letter-spacing:.4px}.section{font-size:8px;font-weight:700;letter-spacing:.8px;fill:#ffffff;fill-opacity:.30}.value{font-size:9px;font-weight:700;fill:#7b6cf6}.knobLabel{font-size:8px;font-weight:700;fill:#9a9aa8}.knob{fill:#14141c}.range{fill:none;stroke:#2c2c36;stroke-width:3.574;stroke-linecap:round}.arc{fill:none;stroke:#7b6cf6;stroke-width:3.574;stroke-linecap:round}.panel{fill:#121218;stroke:#fff;stroke-opacity:.08}.screen{fill:#0e0e14;stroke:#fff;stroke-opacity:.08}.inactive{fill:#0c0c11;stroke:#fff;stroke-opacity:.07}.active{fill:#7b6cf6;stroke:none}.accentText{fill:#7b6cf6}.mutedText{fill:#9a9a9f}
    </style>
    <!-- Exact geometry/colors from knob_strip_default in daw_elements.svg, recentered. -->
    <g id="knob"><circle r="20.322226" class="knob"/><path d="M-18.535 18.535C-23.279 13.792-26.213 7.238-26.213 0-26.213-14.477-14.477-26.213 0-26.213S26.213-14.477 26.213 0c0 7.238-2.934 13.792-7.678 18.535" class="range"/><path d="M-18.535 18.535C-23.279 13.792-26.213 7.238-26.213 0-26.213-14.477-14.477-26.213 0-26.213" class="arc"/><circle cy="-21.822" r="2.5" fill="#7b6cf6"/></g>
    <g id="smallKnob" transform="scale(.78)"><circle r="20.322226" class="knob"/><path d="M-18.535 18.535C-23.279 13.792-26.213 7.238-26.213 0-26.213-14.477-14.477-26.213 0-26.213S26.213-14.477 26.213 0c0 7.238-2.934 13.792-7.678 18.535" class="range"/><path d="M-18.535 18.535C-23.279 13.792-26.213 7.238-26.213 0-26.213-14.477-14.477-26.213 0-26.213" class="arc"/><circle cy="-21.822" r="2.5" fill="#7b6cf6"/></g>
    <g id="toolRail">
