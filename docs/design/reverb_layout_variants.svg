    </text>
    <use href="#toolRail"/>
    <rect x="30" width="4" height="320" fill="#7B6CF6"/>
    <rect x="34" width="280" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="314" width="4" height="320" fill="#7B6CF6"/>
    <use href="#stereoMixOutput" transform="translate(318)"/>
    <g data-source-module="device_tab_bar">
      <rect x="34" width="280" height="40" fill="#22222E"/>
      <g font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
        <rect x="43" y="7" width="50" height="26" rx="5" fill="#7B6CF6" fill-opacity=".18"/><text x="68" y="24" fill="#7B6CF6">TAIL</text>
        <rect x="97" y="7" width="50" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/><text x="122" y="24" fill="#FFFFFF" fill-opacity=".35">TONE</text>
        <rect x="151" y="7" width="50" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/><text x="176" y="24" fill="#FFFFFF" fill-opacity=".35">MOD</text>
        <rect x="207" y="7" width="45" height="26" rx="5" fill="#14141C" stroke="#FFFFFF" stroke-opacity=".1"/><text x="229.5" y="24" fill="#9A9AA8" font-size="7">HALL⌄</text>
        <rect x="257" y="7" width="48" height="26" rx="5" fill="#14141C" stroke="#7B6CF6" stroke-opacity=".35"/><text x="281" y="24" fill="#7B6CF6" font-size="7">FREEZE</text>
      </g>
    </g>
    <g transform="translate(44 49)" data-source-module="preview_filter_response preview_eq_curve">
      <rect width="180" height="176" rx="6" fill="#050508" stroke="#4A4A5C"/>
      <path d="M10 151v-25m6 25V95m6 56v-39m6 39V81m7 70V103" stroke="#7B6CF6" stroke-opacity=".65"/>
      <path d="M36 151C47 58 79 48 102 70s40 57 68 77" fill="url(#screenGlow)" stroke="#7B6CF6" stroke-width="2"/>
      <circle cx="36" cy="151" r="4" fill="#7B6CF6"/><circle cx="135" cy="126" r="4" fill="#7B6CF6"/>
      <text x="10" y="16" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="7">TAIL SHAPE</text>
      <text x="170" y="16" text-anchor="end" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="7">3.2 s</text>
    </g>
    <rect x="231" y="49" width="73" height="263" rx="5" fill="#050508"/>
    <g font-family="Inter, sans-serif" text-anchor="middle">
      <g transform="translate(267.5 93)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">3.2s</text><text y="42" fill="#9A9AA8" font-size="8">DECAY</text></g>
      <g transform="translate(267.5 180)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">64%</text><text y="42" fill="#9A9AA8" font-size="8">SIZE</text></g>
      <g transform="translate(267.5 267)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">78%</text><text y="42" fill="#9A9AA8" font-size="8">DIFF</text></g>
      <g transform="translate(85 271)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">28ms</text><text y="42" fill="#9A9AA8" font-size="8">PRE-DELAY</text></g>
      <g transform="translate(157 271)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">18%</text><text y="42" fill="#9A9AA8" font-size="8">MOD</text></g>
    </g>
  </g>

  <!-- VARIANT D: early and tail sidecars -->
