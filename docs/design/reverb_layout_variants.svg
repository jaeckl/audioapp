      <circle cx="35" cy="130" r="3.5" fill="#7B6CF6"/><circle cx="145" cy="111" r="3.5" fill="#7B6CF6"/>
      <text x="10" y="16" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="7">HALL · RT60 3.2 s</text>
    </g>
    <g font-family="Inter, sans-serif" text-anchor="middle">
      <g transform="translate(142 249)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">3.2s</text><text y="42" fill="#9A9AA8" font-size="8">DECAY</text></g>
      <g transform="translate(206 249)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">64%</text><text y="42" fill="#9A9AA8" font-size="8">SIZE</text></g>
      <g transform="translate(270 249)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">78%</text><text y="42" fill="#9A9AA8" font-size="8">DIFFUSION</text></g>
    </g>
  </g>

  <!-- VARIANT C: wide central console -->
  <g id="variant-c" transform="translate(30 455)">
    <text x="0" y="-26" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">
