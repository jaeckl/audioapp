        <g transform="translate(62 183)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">90Hz</text><text y="35" fill="#9A9AA8" font-size="8">Low Cut</text></g>
        <g transform="translate(62 274)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">25%</text><text y="35" fill="#9A9AA8" font-size="8">Duck</text></g>
