    </text>
    <text x="0" y="-11" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="8">
      Custom input panel for sound shaping before the reverb network
    </text>
    <use href="#toolRail"/>
    <g id="pre-reverb-panel" data-source-module="device_input_panel_dynamic_in">
      <rect x="30" width="64" height="320" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
      <text x="62" y="18" text-anchor="middle" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="8" font-weight="700">PRE</text>
      <g font-family="Inter, sans-serif" text-anchor="middle">
        <g transform="translate(62 90)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">28ms</text><text y="35" fill="#9A9AA8" font-size="8">Pre-delay</text></g>
        <g transform="translate(62 179)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">90Hz</text><text y="35" fill="#9A9AA8" font-size="8">Low Cut</text></g>
        <g transform="translate(62 268)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">25%</text><text y="35" fill="#9A9AA8" font-size="8">Duck</text></g>
      </g>
    </g>
    <rect x="94" width="4" height="320" fill="#7B6CF6"/>
    <rect x="98" width="216" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="314" width="4" height="320" fill="#7B6CF6"/>
    <use href="#stereoMixOutput" transform="translate(318)"/>
    <g data-source-module="device_tab_bar">
      <rect x="98" width="216" height="40" fill="#22222E"/>
      <g font-family="Inter, sans-serif" font-size="7" font-weight="700" text-anchor="middle">
        <rect x="106" y="7" width="48" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/><text x="130" y="24" fill="#FFFFFF" fill-opacity=".35">EARLY</text>
        <rect x="158" y="7" width="48" height="26" rx="5" fill="#7B6CF6" fill-opacity=".18"/><text x="182" y="24" fill="#7B6CF6">TAIL</text>
        <rect x="210" y="7" width="48" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/><text x="234" y="24" fill="#FFFFFF" fill-opacity=".35">TONE</text>
