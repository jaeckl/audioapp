    </text>
    <use href="#toolRail"/>
    <g data-source-module="device_input_panel_dynamic_in">
      <rect x="30" width="64" height="320" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
      <text x="62" y="18" text-anchor="middle" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="8" font-weight="700">EARLY</text>
