    <g transform="translate(108 49)" data-source-module="preview_filter_response">
      <rect width="196" height="164" rx="6" fill="#050508" stroke="#4A4A5C"/>
      <path d="M10 143v-25m6 25V94m6 49v-34m6 34V79m7 64V101" stroke="#7B6CF6" stroke-opacity=".65"/>
      <path d="M36 143C45 60 76 49 99 69s42 53 86 71" fill="url(#screenGlow)" stroke="#7B6CF6" stroke-width="2"/>
      <circle cx="36" cy="143" r="3.5" fill="#7B6CF6"/><circle cx="148" cy="123" r="3.5" fill="#7B6CF6"/>
      <text x="10" y="16" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="7">SPACE · 8.4 s</text>
    </g>
    <g font-family="Inter, sans-serif" text-anchor="middle">
      <g transform="translate(142 263)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">8.4s</text><text y="42" fill="#9A9AA8" font-size="8">DECAY</text></g>
      <g transform="translate(206 263)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">75%</text><text y="42" fill="#9A9AA8" font-size="8">SIZE</text></g>
      <g transform="translate(270 263)"><use href="#mainKnob"/><text y="3" fill="#7B6CF6" font-size="7">90%</text><text y="42" fill="#9A9AA8" font-size="8">DIFF</text></g>
    </g>
    <rect x="314" width="4" height="320" fill="#7B6CF6"/>
    <g id="tail-character-panel" data-source-module="device_output_panel_dynamic_out">
      <rect x="318" width="64" height="320" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
      <text x="350" y="18" text-anchor="middle" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="8" font-weight="700">TAIL</text>
      <g font-family="Inter, sans-serif" text-anchor="middle">
        <g transform="translate(350 92)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">6.4k</text><text y="35" fill="#9A9AA8" font-size="8">Damping</text></g>
        <g transform="translate(350 183)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">18%</text><text y="35" fill="#9A9AA8" font-size="8">Mod</text></g>
        <g transform="translate(350 274)"><use href="#sideKnob"/><text y="3" fill="#9A9AA8" font-size="6">14.2k</text><text y="35" fill="#9A9AA8" font-size="8">High Cut</text></g>
