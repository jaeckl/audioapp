    <rect x="94" width="4" height="320" fill="#7B6CF6"/>
    <rect x="98" width="216" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <g data-source-module="device_tab_bar">
      <rect x="98" width="216" height="40" fill="#22222E"/>
      <rect x="106" y="7" width="48" height="26" rx="5" fill="#7B6CF6" fill-opacity=".18"/>
      <rect x="158" y="7" width="48" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/>
      <text x="130" y="24" text-anchor="middle" fill="#7B6CF6" font-family="Inter, sans-serif" font-size="8" font-weight="700">TAIL</text>
      <text x="182" y="24" text-anchor="middle" fill="#FFFFFF" fill-opacity=".35" font-family="Inter, sans-serif" font-size="8" font-weight="700">TONE</text>
      <rect x="211" y="7" width="42" height="26" rx="5" fill="#14141C" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="232" y="24" text-anchor="middle" fill="#9A9AA8" font-family="Inter, sans-serif" font-size="7">SPACE⌄</text>
      <rect x="258" y="7" width="48" height="26" rx="5" fill="#14141C" stroke="#7B6CF6" stroke-opacity=".35"/>
      <text x="282" y="24" text-anchor="middle" fill="#7B6CF6" font-family="Inter, sans-serif" font-size="7" font-weight="700">FREEZE</text>
