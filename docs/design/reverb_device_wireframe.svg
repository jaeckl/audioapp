<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="318" height="320" viewBox="0 0 318 320">
  <title>Reverb Device UI Proposal</title>
  <desc>
    Standalone composition based on modules from ../architecture/daw_elements.svg:
    default_device_layout, device_tool_rail, widget_filter_mode_bar,
    preview_filter_response, preview_eq_curve, knob_strip_default,
    knob_strip_default_side_panel, and device_output_panel_stereo_mix.
    The source SVG is unchanged.
  </desc>

  <defs>
    <linearGradient id="tailFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B6CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7B6CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Main-card knob_strip_default module, composed once and reused below. -->
    <g id="knob_strip_default" data-source-module="knob_strip_default">
      <circle cx="0" cy="0" r="20.3" fill="#14141C"/>
      <path d="M -18.54 18.54 A 26.21 26.21 0 1 1 18.54 18.54"
            fill="none" stroke="#2C2C36" stroke-width="3.55" stroke-linecap="round"/>
      <path d="M -18.54 18.54 A 26.21 26.21 0 0 1 0 -26.21"
            fill="none" stroke="#7B6CF6" stroke-width="3.55" stroke-linecap="round"/>
      <circle cx="0" cy="-21.82" r="2.5" fill="#7B6CF6"/>
    </g>

    <!-- Smaller knob module reserved for the 64 px output side panel. -->
    <g id="knob_strip_default_side_panel"
       data-source-module="knob_strip_default_side_panel">
      <circle cx="0" cy="0" r="15.25" fill="#14141C"/>
      <path d="M -13.9 13.9 A 19.66 19.66 0 1 1 13.9 13.9"
            fill="none" stroke="#2C2C36" stroke-width="2.7" stroke-linecap="round"/>
      <path d="M -13.9 13.9 A 19.66 19.66 0 0 1 0 -19.66"
            fill="none" stroke="#9A9AA8" stroke-width="2.7" stroke-linecap="round"/>
      <circle cx="0" cy="-16.35" r="1.9" fill="#9A9AA8"/>
    </g>

  </defs>

  <rect width="318" height="320" fill="#0E0E14"/>

  <!-- device_tool_rail -->
  <g id="device_tool_rail" data-source-module="device_tool_rail">
    <path d="M 10 0 H 30 V 320 H 10 A 10 10 0 0 1 0 310 V 10 A 10 10 0 0 1 10 0 Z"
          fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
    <text x="15" y="25" fill="#9A9AA8" font-family="Inter, sans-serif"
          font-size="8" font-weight="700" text-anchor="middle"
          transform="rotate(-90 15 25)">REVERB</text>
    <g fill="none" stroke="#9A9AA8" stroke-width="1.4" stroke-linecap="round">
      <circle cx="15" cy="70" r="7"/>
      <path d="M 12 70 L 18 70 M 15 67 L 15 73"/>
      <rect x="8" y="92" width="14" height="14" rx="3"/>
      <path d="M 11 99 H 19"/>
      <circle cx="15" cy="126" r="7"/>
      <path d="M 11 128 C 13 122 17 122 19 128"/>
    </g>
    <g transform="translate(8 291)" fill="none" stroke="#9A9AA8" stroke-width="1.3">
      <path d="M 2 4 H 12 M 5 4 V 15 H 9 V 4 M 4 1 H 10"/>
    </g>
  </g>

  <!-- default_device_layout: accent, main card, accent -->
  <rect x="30" width="4" height="320" fill="#7B6CF6"/>
  <rect x="34" width="216" height="320" fill="#1A1A24"
        stroke="#4A4A5C" stroke-width="1.5"/>
  <rect x="250" width="4" height="320" fill="#7B6CF6"/>

  <!-- Band 1: device tab bar and mode group share the same 40 px row. -->
  <g id="device_tab_bar" data-source-module="device_tab_bar widget_filter_mode_bar">
    <rect x="34" y="0" width="216" height="40" fill="#22222E"/>
    <rect x="44" y="7" width="196" height="26" rx="5"
          fill="#121218" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M 93 8 V 32 M 142 8 V 32 M 191 8 V 32"
          stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="142" y="7" width="49" height="26" fill="#7B6CF6" fill-opacity="0.18"/>
    <g font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
      <text x="68.5" y="23" fill="#FFFFFF" fill-opacity="0.40">ROOM</text>
      <text x="117.5" y="23" fill="#FFFFFF" fill-opacity="0.40">PLATE</text>
      <text x="166.5" y="23" fill="#7B6CF6">HALL</text>
      <text x="215.5" y="23" fill="#FFFFFF" fill-opacity="0.40">SPACE</text>
    </g>
  </g>

  <!-- Band 2: interactive reverb response screen. -->
  <g id="reverb_response_preview"
     data-source-module="preview_filter_response preview_eq_curve">
    <desc>TAIL edits pre-delay and RT60. TONE edits low cut, high cut, damping, and ducking in the same screen area.</desc>
    <rect x="44" y="48" width="196" height="101" rx="6"
          fill="#050508" stroke="#4A4A5C"/>
    <rect x="45" y="49" width="194" height="17" rx="5" fill="#0A0A0F"/>
    <rect x="48" y="52" width="40" height="11" rx="3"
          fill="#7B6CF6" fill-opacity="0.16"/>
    <text x="68" y="60" fill="#7B6CF6" font-family="Inter, sans-serif"
          font-size="7" font-weight="700" text-anchor="middle">TAIL</text>
    <text x="108" y="60" fill="#FFFFFF" fill-opacity="0.34"
          font-family="Inter, sans-serif" font-size="7" font-weight="700"
          text-anchor="middle">TONE</text>
    <text x="229" y="60" fill="#9A9AA8" font-family="Inter, sans-serif"
          font-size="7" text-anchor="end">HALL · 3.2 s</text>

    <path d="M 51 136 H 233 M 51 111 H 233 M 51 78 H 233"
          stroke="#FFFFFF" stroke-opacity="0.06"/>
    <path d="M 51 69 V 138 M 96 69 V 138 M 142 69 V 138 M 187 69 V 138 M 233 69 V 138"
          stroke="#FFFFFF" stroke-opacity="0.045"/>

    <!-- Early reflections and late-field decay envelope. -->
    <g stroke="#7B6CF6" stroke-width="1.2" stroke-opacity="0.72">
      <path d="M 57 136 V 123 M 61 136 V 91 M 66 136 V 110 M 71 136 V 78 M 77 136 V 102 M 83 136 V 86"/>
    </g>
    <path d="M 84 136 C 91 72 108 70 122 78 C 148 91 161 112 181 124 C 199 133 215 136 233 137 L 233 137 L 84 137 Z"
          fill="url(#tailFill)"/>
    <path d="M 84 136 C 91 72 108 70 122 78 C 148 91 161 112 181 124 C 199 133 215 136 233 137"
          fill="none" stroke="#7B6CF6" stroke-width="1.8" filter="url(#softGlow)"/>

    <!-- Direct-manipulation handles: pre-delay and decay. -->
    <line x1="84" y1="68" x2="84" y2="139" stroke="#7B6CF6" stroke-opacity="0.42"/>
    <circle cx="84" cy="136" r="3.2" fill="#7B6CF6" stroke="#EDEBFF" stroke-width="1"/>
    <text x="84" y="146" fill="#9A9AA8" font-family="Inter, sans-serif"
          font-size="6" text-anchor="middle">28 ms</text>
    <circle cx="181" cy="124" r="3.2" fill="#7B6CF6" stroke="#EDEBFF" stroke-width="1"/>
    <text x="181" y="146" fill="#9A9AA8" font-family="Inter, sans-serif"
          font-size="6" text-anchor="middle">RT60</text>
  </g>

  <!-- Bands 3 and 4: two generously spaced rows of three main knobs. -->
  <g id="reverb_primary_controls" data-source-module="knob_strip_default"
     font-family="Inter, sans-serif" text-anchor="middle">
    <g transform="translate(77 184)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">3.2 s</text>
      <text y="42" fill="#9A9AA8" font-size="8" font-weight="700">DECAY</text></g>
    <g transform="translate(142 184)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">28 ms</text>
      <text y="42" fill="#9A9AA8" font-size="8" font-weight="700">PRE-DELAY</text></g>
    <g transform="translate(207 184)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">64%</text>
      <text y="42" fill="#9A9AA8" font-size="8" font-weight="700">SIZE</text></g>

    <g transform="translate(77 263)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">78%</text>
      <text y="38" fill="#9A9AA8" font-size="8" font-weight="700">DIFFUSION</text></g>
    <g transform="translate(142 263)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">6.4k</text>
      <text y="38" fill="#9A9AA8" font-size="8" font-weight="700">DAMPING</text></g>
    <g transform="translate(207 263)"><use xlink:href="#knob_strip_default"/>
      <text y="3" fill="#7B6CF6" font-size="7" font-weight="700">18%</text>
      <text y="38" fill="#9A9AA8" font-size="8" font-weight="700">MOD</text></g>
  </g>

  <!-- Exact two-control Stereo Mix Output module: Width above Mix. -->
  <g id="device_output_panel_stereo_mix"
     data-source-module="device_output_panel_stereo_mix">
    <path d="M 254 0 H 308 A 10 10 0 0 1 318 10 V 310 A 10 10 0 0 1 308 320 H 254 Z"
          fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
    <text x="286" y="18" fill="#9A9AA8" font-family="Inter, sans-serif"
          font-size="9" font-weight="700" text-anchor="middle">OUT</text>
    <g transform="translate(286 170)" font-family="Inter, sans-serif" text-anchor="middle">
      <use xlink:href="#knob_strip_default_side_panel"/>
      <text y="3" fill="#9A9AA8" font-size="7" font-weight="700">100%</text>
      <text y="38" fill="#9A9AA8" font-size="9" font-weight="700">Width</text>
    </g>
    <g transform="translate(286 249)" font-family="Inter, sans-serif" text-anchor="middle">
      <use xlink:href="#knob_strip_default_side_panel"/>
      <text y="3" fill="#9A9AA8" font-size="7" font-weight="700">35%</text>
      <text y="38" fill="#9A9AA8" font-size="9" font-weight="700">Mix</text>
    </g>
  </g>
</svg>
