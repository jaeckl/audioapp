      <circle cx="42" cy="20" r="2" fill="currentColor"/>
    </symbol>
  </defs>

  <g transform="translate(48 42)">
    <text y="-14" fill="#E8E8F0" font-size="14" font-weight="700">VOICE — Amp ADSR + Glide + Spread + Feedback</text>

    <rect width="30" height="320" fill="#16161E"/>
    <text x="15" y="206" transform="rotate(-90 15 206)" text-anchor="middle"
