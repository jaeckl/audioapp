    <rect x="30" width="4" height="320" fill="#3B82F6"/>
    <rect x="34" width="420" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="34" width="420" height="40" fill="#22222E"/>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="104" y="25" fill="#8A8A98">SOURCE</text>
      <text x="244" y="25" fill="#8A8A98">TONE</text>
      <text x="384" y="25" fill="#FFFFFF">VOICE</text>
    </g>
    <rect x="362" y="36" width="44" height="2.5" fill="#3B82F6"/>

    <rect x="34" y="40" width="420" height="280" fill="#1A1A24"/>

    <!-- AMP ADSR — dominant full-width plate -->
    <rect x="40" y="46" width="408" height="148" rx="4" fill="#16161E"/>
    <g color="#3B82F6" text-anchor="middle">
      <g transform="translate(52 66)">
        <use href="#knob44lo" width="70" height="80"/>
        <text x="35" y="36" fill="#E8E8F0" font-size="10" font-weight="700">3 ms</text>
        <text x="35" y="78" fill="#8A8A98" font-size="8" font-weight="700">ATTACK</text>
      </g>
      <g transform="translate(150 66)">
