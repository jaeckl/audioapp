        <text x="35" y="36" fill="#E8E8F0" font-size="10" font-weight="700">210 ms</text>
        <text x="35" y="78" fill="#8A8A98" font-size="8" font-weight="700">DECAY</text>
      </g>
      <g transform="translate(248 66)">
        <use href="#knob44hi" width="70" height="80"/>
        <text x="35" y="36" fill="#E8E8F0" font-size="10" font-weight="700">80%</text>
        <text x="35" y="78" fill="#8A8A98" font-size="8" font-weight="700">SUSTAIN</text>
      </g>
      <g transform="translate(346 66)">
        <use href="#knob44lo" width="70" height="80"/>
        <text x="35" y="36" fill="#E8E8F0" font-size="10" font-weight="700">340 ms</text>
