    <rect x="320" y="200" width="128" height="114" rx="4" fill="#16161E"/>
    <g color="#3B82F6" text-anchor="middle">
      <g transform="translate(358 220)">
        <use href="#knob44" width="52" height="60"/>
        <text x="26" y="27" fill="#E8E8F0" font-size="9" font-weight="700">0%</text>
        <text x="26" y="72" fill="#8A8A98" font-size="8" font-weight="700">SPREAD</text>
