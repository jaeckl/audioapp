<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="430" viewBox="0 0 1000 430">
  <title>Advanced Bitcrusher — refined Version B</title>
  <desc>Focused UI study at the exact 320 px device height. Existing controls reference daw_elements.svg unchanged. The four-mode button group is a proposed new widget.</desc>
  <defs>
    <style>
      .page{fill:#0e0e14}.shell{fill:#1a1a24;stroke:#4a4a5c;stroke-width:1.5}.top{fill:#22222e}.group{fill:#121218;stroke:#fff;stroke-opacity:.07}.screen{fill:#07070a;stroke:#fff;stroke-opacity:.1}.grid{stroke:#fff;stroke-opacity:.055}.step{fill:none;stroke:#7b6cf6;stroke-width:2.2}.guide{fill:none;stroke:#777784;stroke-width:1;stroke-dasharray:3 3}
      .title{fill:#fff;font:700 15px Inter,Arial}.heading{fill:#fff;font:700 10px Inter,Arial;letter-spacing:.4px}.label{fill:#c6c6d0;font:600 8px Inter,Arial}.muted{fill:#858591;font:500 7px Inter,Arial}.value{fill:#7b6cf6;font:700 9px Inter,Arial}.note{fill:#9a9aa8;font:500 9px Inter,Arial}.prototype{fill:#686875;font:600 8px Inter,Arial;letter-spacing:.25px}
      .mode-bg{fill:#0c0c11;stroke:#fff;stroke-opacity:.08}.mode-active{fill:#7b6cf6}.mode-text{fill:#aaaab5;font:600 7px Inter,Arial}.mode-text-active{fill:#fff;font:700 7px Inter,Arial}
      .mini-group{fill:#0c0c11;stroke:#fff;stroke-opacity:.09}.mini-active{fill:#272731}.icon{fill:none;stroke:#a9a9b5;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.icon-active{stroke:#7b6cf6}
    </style>
    <symbol id="tool" viewBox="0 0 30 320"><use xlink:href="../architecture/daw_elements.svg#kick_tool_rail"/></symbol>
    <symbol id="output" viewBox="0 0 64 320"><use xlink:href="../architecture/daw_elements.svg#group_kick_generator-3-2-9-5" transform="translate(-325.71999,-124.8)"/></symbol>
    <symbol id="knob" viewBox="0 0 65 78"><use xlink:href="../architecture/daw_elements.svg#knob_strip_default" transform="translate(-124,0)"/><rect x="8" y="22" width="49" height="17" fill="#121218"/><rect y="57" width="65" height="21" fill="#121218"/></symbol>
    <symbol id="unit-knob" viewBox="0 0 65 78"><use xlink:href="../architecture/daw_elements.svg#knob_strip_default-0-1" transform="translate(-170.00553,-319.60768)"/><rect x="8" y="22" width="49" height="17" fill="#121218"/><rect y="57" width="65" height="21" fill="#121218"/></symbol>
    <symbol id="box" viewBox="0 0 44 44"><use xlink:href="../architecture/daw_elements.svg#widget_value_drag_box" transform="translate(-50,-90)"/><rect x="2" y="4" width="40" height="18" fill="#121218"/><rect y="27" width="44" height="17" fill="#121218"/></symbol>
    <symbol id="slider" viewBox="0 0 80 44"><use xlink:href="../architecture/daw_elements.svg#widget_normal_sliders" transform="translate(-450,-90)"/><rect y="35" width="80" height="9" fill="#121218"/></symbol>
  </defs>

  <rect width="1000" height="430" class="page"/>
  <text x="50" y="35" class="title">BITCRUSHER · VERSION B REFINEMENT</text>
  <text x="950" y="35" text-anchor="end" class="note">Exact 320 px device height · no input panel · two-knob Stereo Mix Output</text>

  <g transform="translate(215 65)">
    <use xlink:href="#tool" width="30" height="320"/>
    <rect x="30" width="4" height="320" fill="#7b6cf6"/>
    <rect x="34" width="424" height="320" rx="7" class="shell"/>
    <rect x="34" width="424" height="40" rx="7" class="top"/><rect x="34" y="33" width="424" height="7" class="top"/>
    <rect x="458" width="4" height="320" fill="#7b6cf6"/>
    <use xlink:href="#output" x="462" width="64" height="320"/>

    <!-- Proposed new horizontal mode-group widget; not an existing code component. -->
    <g transform="translate(49 8)">
      <rect width="224" height="24" rx="5" class="mode-bg"/>
      <rect x="2" y="2" width="54" height="20" rx="4" class="mode-active"/>
      <path d="M56 3v18M112 3v18M168 3v18" stroke="#fff" stroke-opacity=".07"/>
      <text x="29" y="16" text-anchor="middle" class="mode-text-active">CLASSIC</text>
      <text x="84" y="16" text-anchor="middle" class="mode-text">IMPACT</text>
      <text x="140" y="16" text-anchor="middle" class="mode-text">SUB</text>
      <text x="196" y="16" text-anchor="middle" class="mode-text">ORGANIC</text>
    </g>

    <!-- Flat selector: text and aligned chevron, without combobox chrome. -->
    <g transform="translate(366 8)"><text x="0" y="16" class="label">ANTI-ALIAS</text><path d="m65 11 4 4 4-4" fill="none" stroke="#c6c6d0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- Three shallow group panels with four-pixel gutters. -->
    <rect x="40" y="47" width="86" height="259" rx="5" class="group"/>
    <rect x="130" y="47" width="241" height="259" rx="5" class="group"/>
    <rect x="375" y="47" width="77" height="259" rx="5" class="group"/>

    <!-- Primary clock and quantization controls have equal visual weight. -->
    <g transform="translate(44 59)"><use xlink:href="#unit-knob" width="78" height="94"/><text x="39" y="46" text-anchor="middle" class="value">8.4 kHz</text><text x="39" y="88" text-anchor="middle" class="label">Rate</text></g>
    <g transform="translate(44 181)"><use xlink:href="#knob" width="78" height="94"/><text x="39" y="46" text-anchor="middle" class="value">7 bit</text><text x="39" y="88" text-anchor="middle" class="label">Bits</text></g>

    <!-- Dominant transfer display. -->
    <rect x="136" y="53" width="229" height="154" rx="5" class="screen"/>
    <path d="M147 86H354M147 123H354M147 160H354M198 61V199M250 61V199M302 61V199" class="grid"/>
    <path d="M147 190h26v-21h26v-21h26v-21h26v-21h26V85h26V64h51" class="step"/>
    <path d="M147 190L354 64" class="guide"/>
    <text x="147" y="72" class="label">AMPLITUDE TRANSFER</text>
    <text x="354" y="199" text-anchor="end" class="muted">INPUT →</text>

    <!-- Shape: proposed flat icon group. Discrete automation/modulation snaps to modes. -->
    <g transform="translate(138 216)">
      <rect width="88" height="28" rx="4" class="mini-group"/><rect x="2" y="2" width="20" height="24" rx="3" class="mini-active"/>
      <path d="M6 20h12" class="icon icon-active"/><path d="M28 20c3-13 7-13 10 0" class="icon"/><path d="M50 20l6-13 6 13" class="icon"/><path d="M70 20h5V8h7v12" class="icon"/><text x="44" y="40" text-anchor="middle" class="label">Shape</text>
    </g>

    <!-- Dither and Clip: equal continuous knobs with selectable mode labels. -->
    <g transform="translate(238 213)">
      <use xlink:href="#knob" width="55" height="66"/><text x="27.5" y="33" text-anchor="middle" class="value">38%</text><text x="27.5" y="62" text-anchor="middle" class="label">TPDF⌄</text>
    </g>
    <g transform="translate(302 213)">
      <use xlink:href="#knob" width="55" height="66"/><text x="27.5" y="33" text-anchor="middle" class="value">24%</text><text x="27.5" y="62" text-anchor="middle" class="label">SOFT⌄</text>
    </g>

    <!-- Secondary parameters remain smaller and quieter. -->
    <g transform="translate(381 58)"><use xlink:href="#knob" width="65" height="78"/><text x="32" y="34" text-anchor="middle" class="value">12%</text><text x="32" y="70" text-anchor="middle" class="label">Jitter</text></g>
    <g transform="translate(381 145)"><use xlink:href="#knob" width="65" height="78"/><text x="32" y="34" text-anchor="middle" class="value">22%</text><text x="32" y="70" text-anchor="middle" class="label">Drive</text></g>
    <g transform="translate(381 232)"><use xlink:href="#knob" width="65" height="78"/><text x="32" y="34" text-anchor="middle" class="value">8.2k</text><text x="32" y="70" text-anchor="middle" class="label">Filter</text></g>
  </g>

  <g transform="translate(50 397)"><rect width="8" height="8" rx="2" fill="#7b6cf6"/><text x="16" y="8" class="prototype">MODE GROUP IS A NEW WIDGET PROPOSAL; ALL OTHER CONTROLS ARE EXISTING DAW ELEMENT REFERENCES.</text></g>
</svg>
