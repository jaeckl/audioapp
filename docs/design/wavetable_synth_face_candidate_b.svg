    <text x="136" y="276" class="fieldLabel">SUB SHAPE</text>
    <rect x="134" y="282" width="34" height="20" rx="2" fill="#3B82F6" fill-opacity=".12"/>
    <path d="M140 293 C146 284 154 302 162 293" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M176 298 L188 284 L200 298" fill="none" stroke="#8A8A98" stroke-width="1.5"/>
    <path d="M210 298 V285 H248 V298" fill="none" stroke="#8A8A98" stroke-width="1.5"/>
    <g transform="translate(278,254)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">0%</text><text x="24" y="58" class="label">NOISE</text></g>
    <g transform="translate(350,254)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">0</text><text x="24" y="58" class="label">COLOR</text></g>

    <path d="M458 0 H512 a10 10 0 0 1 10 10 V310 a10 10 0 0 1-10 10 H458 Z" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
    <g transform="translate(461,60)"><use href="#kSmid" width="48" height="52"/><text x="24" y="45" class="value">C</text><text x="24" y="62" class="label">PAN</text></g>
    <g transform="translate(461,164)"><use href="#kShi" width="48" height="52"/><text x="24" y="45" class="value">0 dB</text><text x="24" y="62" class="label">GAIN</text></g>
