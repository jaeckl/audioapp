<?xml version="1.0" encoding="UTF-8"?>
<!--
  WAVETABLE SYNTH / CANDIDATE B
  Three finished states of one 420x320 card. Header 40, face 420x280.
  External tool and output rails shown for attachment context only.
  Grid: 8px base; face inset 6; primary knob visual 52 / hit 60;
  secondary knob visual 40 / hit 48; primary pitch 64; secondary pitch 52.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200"
     viewBox="0 0 620 1200" font-family="Inter, Arial, sans-serif">
  <rect width="620" height="1200" fill="#0E0E14"/>
  <defs>
    <symbol id="kPmid" viewBox="0 0 60 64">
      <rect width="60" height="64" fill="#fff" opacity="0"/>
      <circle cx="30" cy="29" r="20" fill="#14141C"/>
      <path d="M10 47 A26 26 0 1 1 50 47" fill="none" stroke="#2C2C36" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 47 A26 26 0 0 1 30 3" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="30" cy="3" r="2.4" fill="#3B82F6"/>
    </symbol>
    <symbol id="kPhi" viewBox="0 0 60 64">
      <rect width="60" height="64" fill="#fff" opacity="0"/>
      <circle cx="30" cy="29" r="20" fill="#14141C"/>
      <path d="M10 47 A26 26 0 1 1 50 47" fill="none" stroke="#2C2C36" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 47 A26 26 0 1 1 55 25" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="55" cy="25" r="2.4" fill="#3B82F6"/>
    </symbol>
    <symbol id="kPlo" viewBox="0 0 60 64">
      <rect width="60" height="64" fill="#fff" opacity="0"/>
      <circle cx="30" cy="29" r="20" fill="#14141C"/>
      <path d="M10 47 A26 26 0 1 1 50 47" fill="none" stroke="#2C2C36" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 47 A26 26 0 0 1 7 31" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="7" cy="31" r="2.4" fill="#3B82F6"/>
    </symbol>
    <symbol id="kSmid" viewBox="0 0 48 52">
      <rect width="48" height="52" fill="#fff" opacity="0"/>
      <circle cx="24" cy="23" r="15" fill="#14141C"/>
      <path d="M9 37 A20 20 0 1 1 39 37" fill="none" stroke="#2C2C36" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 37 A20 20 0 0 1 24 3" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="3" r="2" fill="#3B82F6"/>
    </symbol>
    <symbol id="kShi" viewBox="0 0 48 52">
      <rect width="48" height="52" fill="#fff" opacity="0"/>
      <circle cx="24" cy="23" r="15" fill="#14141C"/>
      <path d="M9 37 A20 20 0 1 1 39 37" fill="none" stroke="#2C2C36" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 37 A20 20 0 1 1 43 19" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="43" cy="19" r="2" fill="#3B82F6"/>
    </symbol>
    <symbol id="kSlo" viewBox="0 0 48 52">
      <rect width="48" height="52" fill="#fff" opacity="0"/>
      <circle cx="24" cy="23" r="15" fill="#14141C"/>
      <path d="M9 37 A20 20 0 1 1 39 37" fill="none" stroke="#2C2C36" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 37 A20 20 0 0 1 6 27" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="6" cy="27" r="2" fill="#3B82F6"/>
    </symbol>
    <style>
      .tab{font-size:11px;font-weight:700;text-anchor:middle}
      .section{font-size:8px;font-weight:700;letter-spacing:.8px;fill:#6A6A78}
      .label{font-size:7.5px;font-weight:700;fill:#8A8A98;text-anchor:middle}
      .value{font-size:9px;font-weight:700;fill:#E8E8F0;text-anchor:middle}
      .tiny{font-size:7px;font-weight:700;fill:#6A6A78}
      .readout{font-size:8px;font-weight:700;fill:#8A8A98}
      .fieldLabel{font-size:7px;font-weight:700;fill:#8A8A98}
      .fieldValue{font-size:10px;font-weight:700;fill:#E8E8F0}
    </style>
  </defs>

  <!-- OSC / loaded-source waveform earns preview -->
  <g transform="translate(48,44)">
    <text y="-14" fill="#E8E8F0" font-size="14" font-weight="700">OSC / source identity + voice setup</text>
    <rect width="30" height="320" fill="#16161E"/>
    <text x="15" y="184" transform="rotate(-90 15 184)" text-anchor="middle" fill="#8A8A98" font-size="9" font-weight="700" letter-spacing="1">WAVETABLE</text>
    <rect x="30" width="4" height="320" fill="#3B82F6"/>
    <rect x="34" width="420" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="34" width="420" height="40" fill="#22222E"/>
    <text class="tab" x="104" y="25" fill="#FFF">OSC</text>
    <text class="tab" x="244" y="25" fill="#8A8A98">FILTER</text>
    <text class="tab" x="384" y="25" fill="#8A8A98">MIX</text>
    <rect x="84" y="35" width="40" height="2.5" fill="#3B82F6"/>

    <!-- full-bleed face hero -->
    <rect x="34" y="40" width="420" height="280" fill="#07070A"/>
    <text x="46" y="56" class="section">WAVETABLE SOURCE</text>
    <text x="46" y="75" fill="#E8E8F0" font-size="11" font-weight="700">Basic Analog</text>
    <text x="442" y="74" text-anchor="end" class="readout">27 / 64  v</text>
    <line x1="46" y1="116" x2="442" y2="116" stroke="#FFFFFF" stroke-opacity=".07"/>
    <path d="M46 116 C60 82 78 146 96 110 S130 74 148 118 S184 150 202 108 S238 70 256 119 S292 148 310 105 S346 78 364 118 S406 143 442 96"
          fill="none" stroke="#3B82F6" stroke-width="2"/>
    <path d="M46 116 C60 82 78 146 96 110 S130 74 148 118 S184 150 202 108 S238 70 256 119 S292 148 310 105 S346 78 364 118 S406 143 442 96 L442 142 L46 142 Z"
          fill="#3B82F6" fill-opacity=".07"/>
    <line x1="212" y1="84" x2="212" y2="143" stroke="#3B82F6" stroke-opacity=".45" stroke-dasharray="2 3"/>
    <circle cx="212" cy="108" r="3.5" fill="#3B82F6"/>
    <text x="220" y="95" class="readout" fill="#3B82F6">POSITION 42%</text>

    <!-- one floating plate, 6px inset -->
    <rect x="40" y="148" width="408" height="166" rx="4" fill="#16161E"/>
    <line x1="246" y1="156" x2="246" y2="306" stroke="#FFFFFF" stroke-opacity=".07"/>
    <text x="50" y="164" class="section">SHAPE / VOICE</text>
    <g transform="translate(48,168)"><use href="#kPmid" width="60" height="64"/><text x="30" y="54" class="value">42%</text><text x="30" y="68" class="label">POSITION</text></g>
    <g transform="translate(112,174)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">28%</text><text x="24" y="58" class="label">WARP</text></g>
    <rect x="164" y="176" width="74" height="44" rx="3" fill="#14141C"/>
    <text x="172" y="190" class="fieldLabel">WARP MODE</text><text x="172" y="209" class="fieldValue">SYNC</text>
    <path d="M224 194 l7 0 l-3.5 4 Z" fill="#3B82F6"/>
    <g transform="translate(250,174)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">4</text><text x="24" y="58" class="label">VOICES</text></g>
    <g transform="translate(298,174)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">12%</text><text x="24" y="58" class="label">DETUNE</text></g>
    <g transform="translate(346,174)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">0 deg</text><text x="24" y="58" class="label">PHASE</text></g>
    <g transform="translate(394,174)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">0%</text><text x="24" y="58" class="label">RND</text></g>

    <text x="50" y="250" class="section">PITCH</text>
    <g>
      <rect x="48" y="258" width="88" height="44" rx="3" fill="#14141C"/><text x="58" y="273" class="fieldLabel">OCTAVE</text><text x="126" y="291" text-anchor="end" class="fieldValue">+0</text>
      <rect x="142" y="258" width="88" height="44" rx="3" fill="#14141C"/><text x="152" y="273" class="fieldLabel">SEMITONE</text><text x="220" y="291" text-anchor="end" class="fieldValue">0</text>
      <rect x="254" y="258" width="88" height="44" rx="3" fill="#14141C"/><text x="264" y="273" class="fieldLabel">FINE</text><text x="332" y="291" text-anchor="end" class="fieldValue">0 ct</text>
      <rect x="348" y="258" width="92" height="44" rx="3" fill="#14141C"/><text x="358" y="273" class="fieldLabel">UNISON</text><text x="430" y="291" text-anchor="end" class="fieldValue">ON</text>
    </g>

    <!-- external output rail -->
    <path d="M458 0 H512 a10 10 0 0 1 10 10 V310 a10 10 0 0 1-10 10 H458 Z" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
    <g transform="translate(461,60)"><use href="#kSmid" width="48" height="52"/><text x="24" y="45" class="value">C</text><text x="24" y="62" class="label">PAN</text></g>
    <g transform="translate(461,164)"><use href="#kShi" width="48" height="52"/><text x="24" y="45" class="value">0 dB</text><text x="24" y="62" class="label">GAIN</text></g>
  </g>

  <!-- FILTER / response curve earns preview -->
  <g transform="translate(48,444)">
    <text y="-14" fill="#E8E8F0" font-size="14" font-weight="700">FILTER / response hero, modes demoted into plate</text>
    <rect width="30" height="320" fill="#16161E"/>
    <text x="15" y="184" transform="rotate(-90 15 184)" text-anchor="middle" fill="#8A8A98" font-size="9" font-weight="700" letter-spacing="1">WAVETABLE</text>
    <rect x="30" width="4" height="320" fill="#3B82F6"/>
    <rect x="34" width="420" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="34" width="420" height="40" fill="#22222E"/>
    <text class="tab" x="104" y="25" fill="#8A8A98">OSC</text>
    <text class="tab" x="244" y="25" fill="#FFF">FILTER</text>
    <text class="tab" x="384" y="25" fill="#8A8A98">MIX</text>
    <rect x="218" y="35" width="52" height="2.5" fill="#3B82F6"/>
    <rect x="34" y="40" width="420" height="280" fill="#07070A"/>
    <text x="46" y="58" class="section">FILTER RESPONSE</text>
    <text x="46" y="76" class="readout">LP24</text><text x="442" y="76" text-anchor="end" class="readout">1.24 kHz / Q 0.71 / +42% FEG</text>
    <line x1="46" y1="119" x2="442" y2="119" stroke="#FFFFFF" stroke-opacity=".08"/>
    <g stroke="#FFFFFF" stroke-opacity=".045"><line x1="98" y1="84" x2="98" y2="148"/><line x1="168" y1="84" x2="168" y2="148"/><line x1="258" y1="84" x2="258" y2="148"/><line x1="356" y1="84" x2="356" y2="148"/></g>
    <path d="M46 133 C112 132 168 127 214 116 C254 106 286 91 318 92 C348 93 372 121 442 141" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M46 133 C112 132 168 126 216 110 C258 96 286 78 318 80 C350 82 374 120 442 142" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <line x1="318" y1="80" x2="318" y2="148" stroke="#3B82F6" stroke-opacity=".36" stroke-dasharray="2 3"/><circle cx="318" cy="80" r="3.5" fill="#3B82F6"/>
    <g class="tiny"><text x="46" y="147">20</text><text x="96" y="147">100</text><text x="164" y="147">1k</text><text x="350" y="147">10k</text><text x="426" y="147">20k</text></g>

    <rect x="40" y="154" width="408" height="160" rx="4" fill="#16161E"/>
    <text x="50" y="170" class="section">FILTER</text>
    <!-- compact 4-way selector: 44px hit cells, no independent card -->
    <g font-size="8px" font-weight="700" text-anchor="middle">
      <rect x="48" y="178" width="44" height="44" rx="3" fill="#3B82F6" fill-opacity=".12"/><text x="70" y="202" fill="#3B82F6">LP</text><rect x="58" y="216" width="24" height="2" fill="#3B82F6"/>
      <rect x="92" y="178" width="44" height="44" fill="#14141C"/><text x="114" y="202" fill="#8A8A98">HP</text>
      <rect x="136" y="178" width="44" height="44" fill="#14141C"/><text x="158" y="202" fill="#8A8A98">BP</text>
      <rect x="180" y="178" width="44" height="44" rx="3" fill="#14141C"/><text x="202" y="202" fill="#8A8A98">NCH</text>
    </g>
    <g transform="translate(228,170)"><use href="#kPmid" width="60" height="64"/><text x="30" y="54" class="value">1.24k</text><text x="30" y="68" class="label">CUTOFF</text></g>
    <g transform="translate(292,176)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">.71</text><text x="24" y="58" class="label">RES</text></g>
    <g transform="translate(342,176)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">18%</text><text x="24" y="58" class="label">DRIVE</text></g>
    <g transform="translate(392,176)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">+42%</text><text x="24" y="58" class="label">FEG</text></g>

    <line x1="48" y1="242" x2="440" y2="242" stroke="#FFFFFF" stroke-opacity=".07"/>
    <text x="50" y="258" class="section">FILTER ENVELOPE</text>
    <g transform="translate(72,250)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">10ms</text><text x="24" y="58" class="label">ATTACK</text></g>
    <g transform="translate(160,250)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">240ms</text><text x="24" y="58" class="label">DECAY</text></g>
    <g transform="translate(248,250)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">50%</text><text x="24" y="58" class="label">SUSTAIN</text></g>
    <g transform="translate(336,250)"><use href="#kSmid" width="48" height="52"/><text x="24" y="43" class="value">380ms</text><text x="24" y="58" class="label">RELEASE</text></g>

    <path d="M458 0 H512 a10 10 0 0 1 10 10 V310 a10 10 0 0 1-10 10 H458 Z" fill="#16161E" stroke="#4A4A5C" stroke-width="1.5"/>
    <g transform="translate(461,60)"><use href="#kSmid" width="48" height="52"/><text x="24" y="45" class="value">C</text><text x="24" y="62" class="label">PAN</text></g>
    <g transform="translate(461,164)"><use href="#kShi" width="48" height="52"/><text x="24" y="45" class="value">0 dB</text><text x="24" y="62" class="label">GAIN</text></g>
  </g>

  <!-- MIX / amplitude shape + source layers -->
  <g transform="translate(48,844)">
    <text y="-14" fill="#E8E8F0" font-size="14" font-weight="700">MIX / amplitude shape + source layers</text>
    <rect width="30" height="320" fill="#16161E"/>
    <text x="15" y="184" transform="rotate(-90 15 184)" text-anchor="middle" fill="#8A8A98" font-size="9" font-weight="700" letter-spacing="1">WAVETABLE</text>
    <rect x="30" width="4" height="320" fill="#3B82F6"/>
    <rect x="34" width="420" height="320" fill="#1A1A24" stroke="#4A4A5C" stroke-width="1.5"/>
    <rect x="34" width="420" height="40" fill="#22222E"/>
    <text class="tab" x="104" y="25" fill="#8A8A98">OSC</text>
    <text class="tab" x="244" y="25" fill="#8A8A98">FILTER</text>
    <text class="tab" x="384" y="25" fill="#FFF">MIX</text>
    <rect x="366" y="35" width="36" height="2.5" fill="#3B82F6"/>
