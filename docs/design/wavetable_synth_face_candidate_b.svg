    <line x1="46" y1="129" x2="442" y2="129" stroke="#FFFFFF" stroke-opacity=".08"/>
    <path d="M46 129 L86 74 L164 86 L340 86 L420 129 L442 129" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <path d="M46 129 L86 74 L164 86 L340 86 L420 129 L442 129 L442 142 L46 142 Z" fill="#3B82F6" fill-opacity=".07"/>
    <g fill="#3B82F6"><circle cx="86" cy="74" r="3"/><circle cx="164" cy="86" r="3"/><circle cx="340" cy="86" r="3"/><circle cx="420" cy="129" r="3"/></g>
    <g class="tiny"><text x="82" y="68">A</text><text x="160" y="80">D</text><text x="336" y="80">S</text><text x="426" y="122">R</text></g>

    <rect x="40" y="148" width="408" height="166" rx="4" fill="#16161E"/>
    <text x="50" y="164" class="section">AMPLITUDE</text>
    <g transform="translate(60,168)"><use href="#kPlo" width="60" height="64"/><text x="30" y="54" class="value">3ms</text><text x="30" y="68" class="label">ATTACK</text></g>
    <g transform="translate(146,168)"><use href="#kPlo" width="60" height="64"/><text x="30" y="54" class="value">210ms</text><text x="30" y="68" class="label">DECAY</text></g>
    <g transform="translate(232,168)"><use href="#kPhi" width="60" height="64"/><text x="30" y="54" class="value">80%</text><text x="30" y="68" class="label">SUSTAIN</text></g>
    <g transform="translate(318,168)"><use href="#kPlo" width="60" height="64"/><text x="30" y="54" class="value">340ms</text><text x="30" y="68" class="label">RELEASE</text></g>
    <line x1="48" y1="246" x2="440" y2="246" stroke="#FFFFFF" stroke-opacity=".07"/>
    <text x="50" y="262" class="section">SOURCE MIX</text>
    <g transform="translate(66,254)"><use href="#kSlo" width="48" height="52"/><text x="24" y="43" class="value">0%</text><text x="24" y="58" class="label">SUB</text></g>
