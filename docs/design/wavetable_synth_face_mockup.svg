  <text x="40" y="32" fill="#E8E8F0" font-size="16" font-weight="700">Wavetable � dense 3-tab face</text>
  <text x="40" y="52" fill="#6A6A78" font-size="12">daw_elements chrome � kill nested wells � pack knobs � Sub/Noise live on OSC plate</text>

