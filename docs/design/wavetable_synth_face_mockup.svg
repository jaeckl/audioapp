      <path d="M8,36 A20,20 0 1,1 36,36" fill="none" stroke="#2C2C36" stroke-width="3" stroke-linecap="round"/>
      <path d="M8,36 A20,20 0 0,1 12,10" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
